<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sketch Orchard – Restored Build</title>

<style>
:root{
  --ink:#2b2b2b;
  --paper:#f7f4ee;
}
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:var(--paper);
  color:var(--ink);
  font-family:ui-monospace, Menlo, Consolas, monospace;
}
canvas{display:block}
#ui{
  position:fixed;
  top:8px;
  left:8px;
  z-index:10;
}
#basket{
  border:3px solid var(--ink);
  padding:6px 10px;
}
</style>
</head>

<body>
<div id="ui">
  <div id="basket">Inventory: <span id="inv">(empty)</span></div>
</div>

<canvas id="game" width="960" height="420"></canvas>

<script>
/* ======================================================
   CANVAS
====================================================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* ======================================================
   WORLD
====================================================== */
const gy = 300;
const stumpTop = gy - 18;

/* ======================================================
   INPUT
====================================================== */
const keys = {left:false,right:false,up:false,down:false,space:false};

window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  if(e.key==="ArrowLeft")keys.left=true;
  if(e.key==="ArrowRight")keys.right=true;
  if(e.key==="ArrowUp")keys.up=true;
  if(e.key==="ArrowDown")keys.down=true;
  if(e.key===" ")keys.space=true;
});
window.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft")keys.left=false;
  if(e.key==="ArrowRight")keys.right=false;
  if(e.key==="ArrowUp")keys.up=false;
  if(e.key==="ArrowDown")keys.down=false;
  if(e.key===" ")keys.space=false;
});

/* ======================================================
   CAMERA
====================================================== */
let cameraX = 0;
const camera = {topDown:false,locked:false};

/* ======================================================
   PLAYER
====================================================== */
const player = {
  x:120,
  y:0,
  width:40,
  height:54,
  speed:3,
  vy:0,
  jumping:false
};

/* ======================================================
   FROG NPC
====================================================== */
const frog = {
  x:820,
  y:0,
  width:48,
  height:36,
  bob:0
};
let frogActive=false;
let frogHatTip=0;

/* ======================================================
   INVENTORY
====================================================== */
const inventory=[];

/* ======================================================
   ATMOSPHERE
====================================================== */
const crows=[
  {x:780,y:60,speed:0.25,phase:Math.random()*Math.PI*2},
  {x:620,y:90,speed:0.18,phase:Math.random()*Math.PI*2}
];
const fog={x:0,speed:0.015,height:180};
const lowfog={x:0,speed:0.15,height:48};

/* ======================================================
   PLATFORMS
====================================================== */
const platforms=[
  {x:560,heightAboveGround:48,width:120,thickness:14}
];

/* ======================================================
   APPLE
====================================================== */
const apple={
  x:220,
  y:gy-140,
  r:7,
  vy:0,
  falling:false,
  landed:false,
  cracked:false,
  split:false,
  bounce:0,
  bounceVy:0,
  glitter:0,
  pickupable:false,
  pickedUp:false,
  pickupAnim:0,
  spawnTime:performance.now()
};

/* ======================================================
   HELPERS
====================================================== */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

/* ======================================================
   UPDATE
====================================================== */
function update(){
  // movement
  if(!camera.topDown){
    if(keys.left)player.x-=player.speed;
    if(keys.right)player.x+=player.speed;
    if(keys.up&&!player.jumping){
      player.jumping=true;
      player.vy=12;
    }
  }

  // gravity
  player.y+=player.vy;
  player.vy-=0.8;
  if(player.y<=0){
    player.y=0;
    player.vy=0;
    player.jumping=false;
  }

  // platforms
  platforms.forEach(p=>{
    const top=p.heightAboveGround;
    if(
      player.x+player.width>p.x &&
      player.x<p.x+p.width &&
      player.y<=top &&
      player.y>=top-14 &&
      player.vy<=0
    ){
      player.y=top;
      player.vy=0;
      player.jumping=false;
    }
  });

  // apple fall
  const now=performance.now();
  if(!apple.falling&&!apple.landed&&now-apple.spawnTime>2400){
    apple.falling=true;
    apple.vy=0;
  }
  if(apple.falling){
    apple.vy+=0.12;
    apple.vy*=0.985;
    apple.y+=apple.vy;
    if(apple.y>=stumpTop){
      apple.y=stumpTop;
      apple.falling=false;
      apple.landed=true;
      apple.bounce=8;
      apple.bounceVy=0.9;
      apple.glitter=90;
    }
  }

  // bounce → crack
  if(apple.landed&&!apple.cracked){
    apple.bounceVy+=0.22;
    apple.bounce+=apple.bounceVy;
    if(apple.bounce<=0){
      apple.bounce=0;
      apple.bounceVy=0;
      apple.cracked=true;
      apple.split=true;
      apple.pickupable=true;
    }
  }

  if(apple.glitter>0)apple.glitter--;

  // pickup
  const pcx=player.x+player.width/2;
  if(
    apple.pickupable&&!apple.pickedUp &&
    Math.abs(pcx-apple.x)<50 &&
    player.y<6 &&
    keys.down
  ){
    apple.pickedUp=true;
    apple.pickupAnim=0.01;
  }
  if(apple.pickupAnim>0){
    apple.pickupAnim+=0.08;
    if(apple.pickupAnim>=1.8){
      apple.pickupAnim=0;
      inventory.push("apple");
      document.getElementById("inv").textContent=inventory.join(", ");
    }
  }

  frog.bob+=0.04;
  if(frogHatTip>0)frogHatTip--;

  draw();
  cameraX+=(player.x-canvas.width*0.4-cameraX)*0.08;
  if(cameraX<0)cameraX=0;
  requestAnimationFrame(update);
}

/* ======================================================
   DRAW
====================================================== */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const camX=cameraX;

  // sky
  const sky=ctx.createLinearGradient(0,0,0,gy);
  sky.addColorStop(0,"#cfd6d1");
  sky.addColorStop(0.3,"#e8d3a8");
  sky.addColorStop(0.6,"#d1b07a");
  sky.addColorStop(1,"#8f6b45");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,canvas.width,gy);

  // ground
  ctx.fillStyle="#6a6f4a";
  ctx.fillRect(-camX,gy,canvas.width+camX,canvas.height-gy);

  // platform
  platforms.forEach(p=>{
    const px=p.x-camX;
    const py=gy-p.heightAboveGround;
    const g=ctx.createLinearGradient(px,py,px,py+p.thickness);
    g.addColorStop(0,"#c89a5a");
    g.addColorStop(1,"#8a5a2e");
    ctx.fillStyle=g;
    ctx.fillRect(px,py,p.width,p.thickness);
  });

  // apple
  if(!apple.pickedUp){
    const ax=apple.x-camX;
    const ay=apple.y-apple.bounce;
    ctx.fillStyle="#8b2e2a";
    if(!apple.split){
      ctx.beginPath();
      ctx.arc(ax,ay,apple.r,0,Math.PI*2);
      ctx.fill();
    }else{
      for(let i=-1;i<=1;i++){
        ctx.beginPath();
        ctx.arc(ax+i*18,ay,apple.r*0.75,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle="#f2d6b3";
        ctx.fillRect(ax+i*18-2,ay-3,4,6);
        ctx.fillStyle="#8b2e2a";
      }
    }
  }

  // frog
  const fx=frog.x-camX;
  const fy=gy-frog.height+Math.sin(frog.bob)*2;
  ctx.fillStyle="#6f8f6a";
  roundRect(ctx,fx,fy,frog.width,frog.height,10);
  ctx.fill();

  // player
  const px=player.x-camX;
  const py=gy-player.height-player.y;
  ctx.fillStyle="#7a78b8";
  roundRect(ctx,px,py,player.width,player.height,8);
  ctx.fill();
}

update();
</script>
</body>
</html>
